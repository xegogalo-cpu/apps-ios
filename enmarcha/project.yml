name: EnMarcha
options:
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    DEVELOPMENT_TEAM: UHQS8384D9
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 11.0.0
targets:
  EnMarcha:
    type: application
    platform: iOS
    sources:
      - Sources
    dependencies:
      - package: Firebase
        product: FirebaseMessaging
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ec.enmarcha.red
        PRODUCT_NAME: EnMarcha
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    entitlements:
      path: EnMarcha.entitlements
      properties:
        aps-environment: production
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: En Marcha
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        FirebaseAppDelegateProxyEnabled: false
        UILaunchScreen:
          UIColorName: AccentColor
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIBackgroundModes: [remote-notification]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSLocationWhenInUseUsageDescription: Para registrar en el mapa dónde se hizo una actividad de campaña.
        NSCameraUsageDescription: Para escanear el código de asistencia y tomar fotos de actividades y actas.
        NSPhotoLibraryUsageDescription: Para adjuntar una foto de tu galería a una actividad o acta.
        LSApplicationQueriesSchemes: [whatsapp]
