name: maXD
options:
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    DEVELOPMENT_TEAM: UHQS8384D9
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
  configs:
    Release:
      CODE_SIGN_IDENTITY: "Apple Distribution"
targets:
  maXD:
    type: application
    platform: iOS
    sources:
      - Sources
      - ../comun
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xdcuenca.maxd
        PRODUCT_NAME: maXD
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    entitlements:
      path: maXD.entitlements
      properties:
        aps-environment: production
        com.apple.developer.usernotifications.time-sensitive: true
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: maXD
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: AccentColor
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSCameraUsageDescription: Para la foto al marcar entrada y salida, y para fotografiar facturas y comprobantes.
        NSLocationWhenInUseUsageDescription: Para confirmar que marcas tu entrada y salida desde el local.
        NSMicrophoneUsageDescription: Para hablar por el walkie con el equipo del local.
        NSPhotoLibraryAddUsageDescription: Para guardar en tu teléfono los reportes y comprobantes que descargas.
        LSApplicationQueriesSchemes: [whatsapp, comgooglemaps]
