name: Compilar app de Android

on:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Iconos
        run: |
          sudo apt-get install -y imagemagick >/dev/null
          cd enmarcha-android/app/src/main/res
          curl -sL https://en-marcha-red.web.app/icon-512.png -o /tmp/icono.png
          for p in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            d=${p%%:*}; s=${p##*:}
            mkdir -p mipmap-$d
            convert /tmp/icono.png -resize ${s}x${s} mipmap-$d/ic_launcher.png
          done

      - name: Llave de firma
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          printf '%s' "$KS" | tr -d ' \r\n\t' | base64 -d -i > "$RUNNER_TEMP/firma.keystore"
          echo "Llave: $(stat -c %s "$RUNNER_TEMP/firma.keystore") bytes"

      - name: Compilar
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/firma.keystore
          ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          ANDROID_KEY_PASS: ${{ secrets.ANDROID_KEY_PASS }}
        run: gradle -p enmarcha-android :app:bundleRelease :app:assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: en-marcha-android
          path: |
            enmarcha-android/app/build/outputs/bundle/release/*.aab
            enmarcha-android/app/build/outputs/apk/release/*.apk
