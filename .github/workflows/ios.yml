# Compila y sube a App Store Connect las apps de iPhone de Grupo XD (Botaniker Alchemist S.A.S.).
# Se corre a mano: Actions → "Subir app de iPhone" → Run workflow → elegir maxd o bodega.
# Secretos (Settings → Secrets → Actions): ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8 (texto completo de la llave .p8).
name: Subir app de iPhone
on:
  workflow_dispatch:
    inputs:
      app:
        description: "¿Qué app?"
        required: true
        default: maxd
        type: choice
        options: [maxd, bodega]
jobs:
  subir:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app || true
      - name: XcodeGen
        run: brew install xcodegen
      - name: Llave de App Store Connect
        env:
          P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/llave"
          # Se limpia lo que deja Windows (\r) y espacios sobrantes; se revisa la forma sin mostrar la llave.
          printf '%s\n' "$P8" | tr -d '\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' | grep -v '^$' > "$RUNNER_TEMP/llave/AuthKey.p8"
          echo "Primera línea: $(head -1 "$RUNNER_TEMP/llave/AuthKey.p8")"
          echo "Última línea: $(tail -1 "$RUNNER_TEMP/llave/AuthKey.p8")"
          echo "Líneas: $(wc -l < "$RUNNER_TEMP/llave/AuthKey.p8")"
          echo "Largo de cada línea: $(awk '{printf "%d ", length}' "$RUNNER_TEMP/llave/AuthKey.p8")"
          echo "Empieza con BEGIN: $(head -1 "$RUNNER_TEMP/llave/AuthKey.p8" | grep -c 'BEGIN PRIVATE KEY')"
          echo "Termina con END: $(tail -1 "$RUNNER_TEMP/llave/AuthKey.p8" | grep -c 'END PRIVATE KEY')"
          # Si el cuerpo quedó en otra forma (líneas pegadas o partidas), se rearma en bloques de 64 como manda el formato PEM.
          CUERPO=$(sed -e '/BEGIN PRIVATE KEY/d' -e '/END PRIVATE KEY/d' "$RUNNER_TEMP/llave/AuthKey.p8" | tr -d ' \n\t')
          { echo "-----BEGIN PRIVATE KEY-----"; echo "$CUERPO" | fold -w 64; echo "-----END PRIVATE KEY-----"; } > "$RUNNER_TEMP/llave/AuthKey.p8"
          echo "Largo del cuerpo: ${#CUERPO} · válido: $(echo "$CUERPO" | base64 -d >/dev/null 2>&1 && echo si || echo no)"
      - name: Generar proyecto
        run: cd "${{ inputs.app }}" && xcodegen generate
      - name: Compilar
        env:
          KID: ${{ secrets.ASC_KEY_ID }}
          ISS: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          cd "${{ inputs.app }}"
          if [ "${{ inputs.app }}" = "maxd" ]; then S=maXD; else S=BodegaXD; fi
          BUILD=$(( ${{ github.run_number }} + 1 ))
          xcodebuild -project "$S.xcodeproj" -scheme "$S" -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/app.xcarchive" \
            CURRENT_PROJECT_VERSION=$BUILD CODE_SIGN_IDENTITY="Apple Distribution" archive \
            -allowProvisioningUpdates -authenticationKeyPath "$RUNNER_TEMP/llave/AuthKey.p8" \
            -authenticationKeyID "$KID" -authenticationKeyIssuerID "$ISS"
      - name: Subir a App Store Connect
        env:
          KID: ${{ secrets.ASC_KEY_ID }}
          ISS: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/app.xcarchive" \
            -exportOptionsPlist ExportOptions.plist -exportPath "$RUNNER_TEMP/salida" \
            -allowProvisioningUpdates -authenticationKeyPath "$RUNNER_TEMP/llave/AuthKey.p8" \
            -authenticationKeyID "$KID" -authenticationKeyIssuerID "$ISS"
